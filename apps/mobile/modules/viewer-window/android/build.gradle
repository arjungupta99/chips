plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'chat.chips'
version = '0.0.0'

android {
  namespace "chat.chips.viewerwindow"
  defaultConfig {
    versionCode 1
    versionName '0.0.0'
  }
}

dependencies {
  // The activity, for Picture in Picture's changes; the app already has it, through React Native.
  implementation 'com.facebook.react:react-android'
}
