[package]
name = "chips-desktop"
version = "1.4.0"
description = "Chips on the desktop: the web app in a native shell that can find a server, notify you, and be decided from."
authors = ["Chips"]
license = "FSL-1.1-ALv2"
edition = "2021"
rust-version = "1.77"

[lib]
name = "chips_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
# Chips for Mac updating itself (everything in step, phase 5): a release checked against the key
# `plugins.updater.pubkey` names before anything else, then swapped in for this app.
tauri-plugin-updater = "2"
# What a checked download hashes to, so the file that waits is read again as the same bytes.
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A key for a page the window holds for its frame (ADR 0201's addendum): 256 random bits.
getrandom = "0.3.4"
# Service discovery, so the app finds a server on the network without being told an address.
mdns-sd = "0.21.1"
# Notifications with real buttons. Apple's own notification centre through the system API:
# `tauri-plugin-notification` shows a banner but gives no Approve and no Deny, and a banner you
# cannot answer is not what M2.2 asks for.
mac-notification-sys = "0.6.15"

# getaddrinfo's own answer and the Mac's tunnels, for a link only some devices reach (ADR 0227).
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Whether another copy of the app runs already, so a launch at login gives way to it (ADR 0215),
# and the window's frame kept from one launch to the next (ADR 0267).
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSResponder", "NSRunningApplication", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSString"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Xcode 27's `strip` leaves a library built for macOS 13 that dyld refuses to load ("mis-aligned
# LINKEDIT string pool"), so the proc macros and build scripts a release build loads while it
# compiles are left unstripped. The app's own binary is stripped as before.
[profile.release.build-override]
strip = false
