<!--
  The Mac app's icon: the chip, gold on ink, on the macOS icon grid (an 824 tile with continuous
  corners, 100 in from each edge of the 1024 canvas, so it sits level with the system's own icons
  in the Dock). Since ADR 0096 the mark is the outline an agent wears
  (`packages/ui/src/components/face/outline.ts`): the body and the ten pins below are its `bittenPath` and `pinsOf` for the
  square each `data-outline` and `data-pins` names (left, top, side), and
  `tools/guardrails/icons-wear-the-outline.test.ts` fails when they drift apart.
  The body is lit from above as an agent's face is, a little lighter at the top and deeper at
  the foot: `litGround` of the gold at `MARK_LIGHT` (`apps/mobile/src/ui/lit.ts`), which the guardrail holds.
  `icon.png` is this file at 512 square, on nothing; the bundler makes the .icns from it.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>The Chips mark: a chip, gold on ink</title>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#16181d"/>
  <g fill="#ecede8" fill-opacity="0.55" data-pins="300 300 424">
    <rect x="379.5" y="244.88" width="53" height="72.08" rx="26.5"/>
    <rect x="485.5" y="244.88" width="53" height="72.08" rx="26.5"/>
    <rect x="707.04" y="485.5" width="72.08" height="53" rx="26.5"/>
    <rect x="707.04" y="591.5" width="72.08" height="53" rx="26.5"/>
    <rect x="591.5" y="707.04" width="53" height="72.08" rx="26.5"/>
    <rect x="485.5" y="707.04" width="53" height="72.08" rx="26.5"/>
    <rect x="379.5" y="707.04" width="53" height="72.08" rx="26.5"/>
    <rect x="244.88" y="591.5" width="72.08" height="53" rx="26.5"/>
    <rect x="244.88" y="485.5" width="72.08" height="53" rx="26.5"/>
    <rect x="244.88" y="379.5" width="72.08" height="53" rx="26.5"/>
  </g>
  <defs>
    <linearGradient id="lit" x1="0" y1="300" x2="0" y2="724" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fed17b"/>
      <stop offset="1" stop-color="#ebc339"/>
    </linearGradient>
  </defs>
  <path fill="url(#lit)" data-outline="300 300 424" d="M406 300H581.23A119.25 119.25 0 0 0 724 442.77V618A106 106 0 0 1 618 724H406A106 106 0 0 1 300 618V406A106 106 0 0 1 406 300Z"/>
</svg>
