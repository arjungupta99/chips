<!doctype html>
<!--
  The film's scene (ADR 0217), 1080 × 1920: the glow, a beat's words arriving a word at a time, a
  phone with its island and status bar (and for the first beat a Mac window, the phone in front of
  its corner), the end card, and a camera that leans in and back within each beat. `compose.mjs`
  sets it up for a beat (`setup`), draws a frame into it (`render`), and screenshots it.
-->
<html lang="en"><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #08080a; }
  body { font-family: -apple-system, system-ui, "SF Pro Display", sans-serif; -webkit-font-smoothing: antialiased; }
  #scene { position: absolute; inset: 0; }
  /* The glow drifts up and to the left for the whole film (`render`), so it runs far past the frame's
     right and foot: in a film of 80 s its edge never comes into view (WC-12). Its two lights stand
     where they did when it ran 200 px past every side. */
  #glow { position: absolute; left: -200px; top: -200px; width: 2780px; height: 3120px;
    background:
      radial-gradient(900px 700px at 266.4px 278.4px, rgba(244, 196, 66, 0.10), transparent 70%),
      radial-gradient(1000px 800px at 1302.4px 2134.4px, rgba(0, 186, 122, 0.12), transparent 70%); }
  #words { position: absolute; left: 90px; right: 90px; top: 120px; text-align: center; }
  #eyebrow { color: #00ba7a; font-size: 28px; font-weight: 700; letter-spacing: 0.16em; }
  #title { margin-top: 18px; color: #f4f4f6; font-size: 66px; font-weight: 700; letter-spacing: -0.8px; line-height: 1.08; text-wrap: balance; }
  #sentence { margin-top: 22px; color: #9c9ca8; font-size: 33px; line-height: 1.32; text-wrap: balance; }
  .w { display: inline-block; white-space: pre; will-change: transform, opacity; }
  #rig { position: absolute; inset: 0; transform-origin: 50% 62%; will-change: transform; }
  #device { position: absolute; left: 50%; top: 486px; width: 641.5px; height: 1356.5px; margin-left: -320.75px;
    border-radius: 100px; background: #1a1a1d; box-shadow: 0 0 0 2px #2c2c31, 0 50px 120px rgba(0,0,0,0.55);
    transform-origin: 0 0; }
  #screen { position: absolute; left: 14px; top: 14px; width: 613.5px; height: 1328.5px; border-radius: 86px; overflow: hidden; background: #0f0f12; }
  #app { position: absolute; inset: 0; width: 100%; height: 100%; }
  #island { position: absolute; top: 17px; left: 50%; width: 197px; height: 58px; margin-left: -98.5px; border-radius: 29px; background: #000; }
  #time { position: absolute; top: 30px; left: 70px; width: 110px; text-align: center; color: #fff; font-size: 26.5px; font-weight: 600; letter-spacing: -0.2px; }
  #icons { position: absolute; top: 34px; right: 52px; display: flex; gap: 9px; align-items: center; }
  #home { position: absolute; bottom: 12px; left: 50%; width: 209px; height: 8px; margin-left: -104.5px; border-radius: 4px; background: rgba(255,255,255,0.72); }
  #mac { position: absolute; left: 40px; top: 480px; width: 1000px; height: 661px; border-radius: 20px; overflow: hidden;
    background: #18181b; box-shadow: 0 0 0 1.5px #2e2e33, 0 40px 110px rgba(0,0,0,0.6); display: none; }
  #mac .bar { height: 36px; display: flex; gap: 9px; align-items: center; padding-left: 16px; }
  #mac .bar i { width: 13px; height: 13px; border-radius: 50%; display: block; }
  #macapp { display: block; width: 1000px; height: 625px; }
  #end { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 120px; }
  #end img { width: 240px; height: 240px; border-radius: 54px; box-shadow: 0 30px 90px rgba(0,0,0,0.5); }
  #end h1 { color: #f4f4f6; font-size: 92px; margin: 54px 0 0; font-weight: 700; letter-spacing: -1.2px; }
  #end p { color: #9c9ca8; font-size: 38px; margin: 18px 0 0; }
  #over { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; opacity: 0; }
  #fade { position: absolute; inset: 0; background: #08080a; pointer-events: none; }
</style></head><body>
<div id="scene">
  <div id="glow"></div>
  <div id="words">
    <div id="eyebrow"></div>
    <div id="title"></div>
    <div id="sentence"></div>
  </div>
  <div id="rig">
    <div id="mac"><div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
      <canvas id="macapp"></canvas></div>
    <div id="device"><div id="screen">
      <canvas id="app"></canvas>
      <div id="island"></div>
      <div id="time">9:41</div>
      <div id="icons">
        <svg width="29" height="18" viewBox="0 0 29 18"><title>Signal</title><rect x="0" y="12" width="5" height="6" rx="1.4" fill="#fff"/><rect x="8" y="8" width="5" height="10" rx="1.4" fill="#fff"/><rect x="16" y="4" width="5" height="14" rx="1.4" fill="#fff"/><rect x="24" y="0" width="5" height="18" rx="1.4" fill="#fff"/></svg>
        <svg width="26" height="19" viewBox="0 0 26 19"><title>Wi-Fi</title><path d="M13 18.5l3.6-3.9a5.4 5.4 0 0 0-7.2 0z" fill="#fff"/><path d="M13 9.6c2.6 0 5 1 6.8 2.7l2.2-2.4A12.7 12.7 0 0 0 13 6.3c-3.5 0-6.6 1.3-9 3.6l2.2 2.4A9.5 9.5 0 0 1 13 9.6z" fill="#fff"/><path d="M13 3.2c4.3 0 8.2 1.7 11 4.4l2-2.2A18.9 18.9 0 0 0 13 0C8 0 3.5 2 0 5.4l2 2.2c2.8-2.7 6.7-4.4 11-4.4z" fill="#fff"/></svg>
        <svg width="41" height="19" viewBox="0 0 41 19"><title>Battery</title><rect x="0.8" y="0.8" width="35" height="17.4" rx="5.2" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.6"/><rect x="3.4" y="3.4" width="29.8" height="12.2" rx="3.2" fill="#fff"/><path d="M38.4 6.5v6c1.3-.4 2.2-1.6 2.2-3s-.9-2.6-2.2-3z" fill="rgba(255,255,255,0.45)"/></svg>
      </div>
      <div id="home"></div>
    </div></div>
  </div>
  <div id="end"><img src="/icon.png" alt=""><h1>Chips</h1><p id="end-line"></p></div>
  <img id="over" alt="">
  <div id="fade"></div>
</div>
<script type="module">
  import { changedRuns, fitShift, GROUND, HEADER, headerDiff, LIST } from "./motion.mjs";

  const clamp = (v) => Math.min(1, Math.max(0, v));
  const ease = (v) => (v < 0.5 ? 4 * v * v * v : 1 - (-2 * v + 2) ** 3 / 2);
  const out = (v) => 1 - (1 - v) ** 3;
  const span = (t, a, b) => clamp((t - a) / (b - a));
  const $ = (id) => document.getElementById(id);
  const groundColour = `rgb(${GROUND - 1}, ${GROUND}, ${GROUND + 3})`;

  /** A line set as words, each its own span so it can arrive on its own. */
  function words(el, text) {
    el.innerHTML = "";
    return text.split(/(\s+)/).filter((w) => w.length > 0).map((w) => {
      const s = document.createElement("span");
      s.className = "w";
      s.textContent = w;
      el.append(s);
      return s;
    });
  }
  function reveal(list, from, gap, dur, t) {
    list.forEach((s, i) => {
      const v = out(span(t, from + i * gap, from + i * gap + dur));
      s.style.opacity = v;
      s.style.transform = `translateY(${(1 - v) * 22}px)`;
    });
  }

  const images = new Map();
  async function load(src) {
    let image = images.get(src);
    if (image === undefined) {
      image = new Image();
      image.src = src;
      await image.decode();
      images.set(src, image);
      if (images.size > 8) images.delete(images.keys().next().value);
    }
    return image;
  }
  /** A frame as grey, `width` pixels wide. */
  function gray(image, width) {
    const h = Math.round((image.naturalHeight * width) / image.naturalWidth);
    const c = new OffscreenCanvas(width, h);
    const x = c.getContext("2d");
    x.drawImage(image, 0, 0, width, h);
    const d = x.getImageData(0, 0, width, h).data;
    const g = new Float32Array(width * h);
    for (let i = 0; i < width * h; i += 1) g[i] = d[i * 4] * 0.3 + d[i * 4 + 1] * 0.59 + d[i * 4 + 2] * 0.11;
    return { w: width, h, g };
  }
  const SMALL = 290;
  const scaled = (band, k) => ({ top: Math.round(band.top * k), bottom: Math.round(band.bottom * k) });

  /**
   * What happened between two frames of a phone shot: how far the list moved and the rows that
   * changed, or nothing moved (`shift` 0) for a screen that changed or a change in place.
   */
  window.measure = async (beforeSrc, afterSrc) => {
    const [a, b] = await Promise.all([load(beforeSrc), load(afterSrc)]);
    const ks = SMALL / 393;
    const sa = gray(a, SMALL);
    const sb = gray(b, SMALL);
    const fit = fitShift(sa, sb, scaled(LIST, ks), Math.round(350 * ks));
    const header = headerDiff(sa, sb, scaled(HEADER, ks));
    if (fit.shift === 0 || fit.error > 12 || header > 4) return { shift: 0, error: fit.error, header };
    const width = a.naturalWidth;
    const k = width / 393;
    const found = changedRuns(gray(a, width), gray(b, width), scaled(LIST, k), Math.round((fit.shift * width) / SMALL), k);
    return { ...found, error: fit.error, header };
  };

  let beat;
  let parts;
  /** A beat: its words, how the scene is laid out, and whether it opens or closes the film. */
  window.setup = (b) => {
    beat = b;
    $("words").style.display = b.layout === "end" ? "none" : "block";
    if (b.layout !== "end") {
      $("eyebrow").textContent = b.caption.eyebrow.toUpperCase();
      parts = { title: words($("title"), b.caption.line), sentence: words($("sentence"), b.caption.sentence) };
    } else {
      $("end-line").textContent = b.line;
    }
    $("rig").style.display = b.layout === "end" ? "none" : "block";
    $("end").style.display = b.layout === "end" ? "flex" : "none";
    $("mac").style.display = b.layout === "mac" ? "block" : "none";
    // Beside the Mac, the phone stands smaller in front of its corner.
    $("device").style.transform = b.layout === "mac" ? "translate(420.75px, 500px) scale(0.58)" : "none";
  };

  /** A frame drawn whole into a canvas the size of the frame. */
  function paint(canvas, image, alpha = 1) {
    if (canvas.width !== image.naturalWidth || canvas.height !== image.naturalHeight) {
      canvas.width = image.naturalWidth;
      canvas.height = image.naturalHeight;
    }
    const x = canvas.getContext("2d");
    x.globalAlpha = alpha;
    x.drawImage(image, 0, 0);
    x.globalAlpha = 1;
  }

  /**
   * An arrival, drawn over the frame: what was there slides up (or down) by the distance the list
   * moved, and the rows that changed come in under it. Rows both frames share sit on each other as
   * the list moves, so only what changed is drawn again: a line or two dissolves where it stands; a
   * bubble or more goes down to the ground first and the new one comes up from it, rather than the
   * two showing through each other. With nothing moved, what changed dissolves where it stands.
   */
  async function arrive(canvas, current, move) {
    const before = await load(move.before);
    if (move.shift === 0) {
      paint(canvas, before);
      paint(canvas, current, move.fade);
      return;
    }
    const k = canvas.width / 393;
    const { top, bottom } = scaled(LIST, k);
    const W = canvas.width;
    const H = bottom - top;
    const x = canvas.getContext("2d");
    x.save();
    x.beginPath();
    x.rect(0, top, W, H);
    x.clip();
    x.fillStyle = groundColour;
    x.fillRect(0, top, W, H);
    x.drawImage(before, 0, top, W, H, 0, top - move.p * move.shift, W, H);
    for (const [y0, y1] of move.runs) {
      const at = y0 + (1 - move.p) * move.shift;
      const big = y1 - y0 > move.bubble;
      if (big) {
        x.globalAlpha = move.out;
        x.fillRect(0, at, W, y1 - y0);
      }
      x.globalAlpha = big ? move.in : move.fade;
      x.drawImage(current, 0, y0, W, y1 - y0, 0, at, W, y1 - y0);
    }
    x.restore();
    x.globalAlpha = 1;
  }

  /** A frame of a beat with the app in it: the shot's frame, the words, and the camera. */
  async function drawApp(f) {
    const { t, T } = f;
    const canvas = $("app");
    const current = await load(f.src);
    paint(canvas, current);
    if (f.move !== undefined) await arrive(canvas, current, f.move);
    // From one shot of a beat to the next: the last of the one before dissolves away.
    if (f.join !== undefined) paint(canvas, await load(f.join.src), f.join.a);
    if (beat.layout === "mac") paint($("macapp"), await load(f.macSrc));
    const eye = out(span(t, 0.15, 0.6));
    $("eyebrow").style.opacity = eye;
    $("eyebrow").style.transform = `translateY(${(1 - eye) * 14}px)`;
    reveal(parts.title, 0.3, 0.07, 0.6, t);
    reveal(parts.sentence, 0.9, 0.035, 0.55, t);
    // The scene leans in once its words are read, and back before the next beat, which starts
    // where this one did.
    const rise = beat.intro ? out(span(t, 0, 1.0)) : 1;
    const lean = ease(span(t, 0.6, 2.8)) - ease(span(t, T - 2.0, T - 0.15));
    const scale = 0.97 + 0.03 * rise + 0.03 * lean;
    $("rig").style.transform = `translateY(${(1 - rise) * 60}px) scale(${scale})`;
  }

  /** The end card, rising in. */
  function drawEnd(t) {
    const v = out(span(t, 0.1, 0.9));
    $("end").style.opacity = v;
    $("end").style.transform = `translateY(${(1 - v) * 30}px) scale(${0.96 + 0.04 * v})`;
  }

  /** What covers the scene: the film's fade in and out, and the last beat dissolving away. */
  async function cover(f) {
    const { t, T } = f;
    const fadeIn = beat.intro ? 1 - out(span(t, 0, 0.45)) : 0;
    const fadeOut = beat.outro ? ease(span(t, T - 0.7, T)) : 0;
    $("fade").style.opacity = String(fadeIn + fadeOut);
    const over = $("over");
    if (f.over === undefined) {
      over.style.opacity = "0";
      return;
    }
    if (over.getAttribute("src") !== f.over.src) {
      over.src = f.over.src;
      await over.decode();
    }
    over.style.opacity = String(f.over.a);
  }

  /** One frame of the film, at `t` seconds into its beat of `T`, `gt` into the film. */
  window.render = async (f) => {
    if (beat.layout === "end") drawEnd(f.t);
    else await drawApp(f);
    $("glow").style.transform = `translate(${-18 * f.gt}px, ${-10 * f.gt}px)`;
    await cover(f);
  };
  window.ready = true;
</script>
</body></html>
